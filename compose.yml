secrets:
  postgres_password:
    file: ./password
  pgbouncer_userlist:
    file: ./userlist.txt

services:
  postgresql:
    image: postgres:17
    container_name: postgresql
    restart: unless-stopped
    networks:
      - pgstacknet
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # Without config_file=, the mounted postgresql.conf/pg_hba.conf are IGNORED
    # (the postgres image only reads them when told to).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ./data:/var/lib/postgresql/data:Z
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    restart: unless-stopped
    networks:
      - pgstacknet
    ports:
      # Loopback only by default — nothing exposed off-host. Remote apps come in
      # via `tailscale serve --bg --tcp=6432 tcp://127.0.0.1:6432` (tailnet-only,
      # never `funnel`), or an SSH tunnel for one-off admin.
      - "127.0.0.1:6432:5432"
    links:
      - postgresql:postgresql
    depends_on:
      postgresql:
        condition: service_healthy
    secrets:
      - pgbouncer_userlist
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./ssl:/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z postgresql 5432 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pgstacknet:
    external: true
