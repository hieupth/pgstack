# Loaded via hba_file (see the postgresql service command in compose.yml).
# Trust ONLY the container-local unix socket - reachable solely through
# `docker exec` (host root); used by provisioning/admin scripts.
# Every TCP path requires SCRAM.
local   all   all                     trust
host    all   all   0.0.0.0/0         scram-sha-256
host    all   all   ::/0              scram-sha-256
