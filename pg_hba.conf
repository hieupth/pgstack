# Loaded via hba_file (see the postgresql service command in compose.yml).
# Trust ONLY the container-local unix socket - reachable solely through
# `docker exec` (host root); used by provisioning/admin scripts.
# Every TCP path requires SCRAM.
local   all   all                     trust
# The superuser is NEVER reachable over TCP. Break-glass is `docker exec`
# (the trusted socket above). Rationale: the host itself can route to
# container IPs on the docker bridge, so any local process holding
# ./password would otherwise have a superuser login path. Reject closes
# that door regardless of file permissions on the password file.
host    all   postgres   0.0.0.0/0    reject
host    all   postgres   ::/0         reject
host    all   all        0.0.0.0/0    scram-sha-256
host    all   all        ::/0         scram-sha-256
